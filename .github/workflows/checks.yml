name: Software and benchmark file checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_results.py
      - run: python tools/update_docs.py --check
      - run: node --check web/app.js
      - run: node --check web/tables.js
      - run: node --check web/browser.js
      - run: node tests/test_ui.js
      - run: node tests/test_extension_ui.js
      - run: node tests/test_metric_selection.js
      - run: node tests/test_tables.js
      - run: node tests/test_live_results.js
      - run: node tests/test_browser_backend.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_ui_browser.cjs
      - run: node tests/test_static_browser.cjs
