name: Deploy GitHub Pages
on:
  workflow_run:
    workflows: ['Software and benchmark file checks']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/build_pages.py --output-dir _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify hosted HTTPS site against an isolated loopback provider
        env:
          WATTEVER_PUBLIC_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/test_static_browser.cjs
